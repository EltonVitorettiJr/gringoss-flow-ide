version: '3.8'

services:
  db_gringoss:
    image: postgres:15-alpine
    container_name: gringoss_postgres
    restart: no
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: gringoss
    ports:
      - "5432:5432"
    volumes:
      - gringoss_data:/var/lib/postgresql/data

volumes:
  gringoss_data: